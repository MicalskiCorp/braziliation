name: Unity (compilação + EditMode)

# Compila o projeto Unity inteiro e roda os testes de Assets/Tests/EditMode/ via GameCI.
# Desligado até a licença existir — ver Desenvolvimento/Docs/Tech/unity-ci.md.
# Localmente, o equivalente é a skill unity-validar.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Desenvolvimento/Assets/**'
      - 'Desenvolvimento/Packages/**'
      - 'Desenvolvimento/ProjectSettings/**'

jobs:
  editmode:
    # Gate no nível do JOB, de propósito: assim o check aparece como "skipped".
    # Até 2026-09-20 o gate ficava nos passos, e o job fechava como **success em 6
    # segundos** com checkout, cache e testes pulados — um check verde que não tinha
    # verificado nada é indistinguível de um que verificou, e é pior que um vermelho.
    #
    # É variável de repositório, e não secret, porque o contexto `secrets` não existe
    # em `if:` de job — só em `env:` e `with:`.
    #
    # Ligar depois de criar os secrets:  gh variable set UNITY_CI_ENABLED --body true
    if: vars.UNITY_CI_ENABLED == 'true'

    runs-on: ubuntu-latest

    steps:
      # Variável ligada sem os secrets = configuração pela metade. Falhar aqui, com a
      # causa dita, é melhor do que deixar o GameCI falhar lá na frente por outro motivo.
      - name: Conferir secrets de licença
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_CI_ENABLED está ligado, mas o secret UNITY_LICENSE não existe. Ver Desenvolvimento/Docs/Tech/unity-ci.md."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache da Library
        uses: actions/cache@v4
        with:
          path: Desenvolvimento/Library
          key: Library-${{ hashFiles('Desenvolvimento/Packages/packages-lock.json') }}
          restore-keys: Library-

      - name: Testes EditMode (GameCI)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Desenvolvimento
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
