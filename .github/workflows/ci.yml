name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, build and test (.NET)
        shell: bash
        run: |
          set -euo pipefail
          # Alvo único e explícito, SEM fallback: se o projeto sumir de lugar o CI
          # deve falhar alto, não cair silenciosamente num projeto antigo — foi
          # exatamente o fallback anterior que fez o CI rodar testes obsoletos.
          # É o .csproj e não o .slnx porque .slnx só é aceito pelo dotnet CLI a
          # partir do SDK 9.0.2xx e este job roda em 8.0.x; o ProjectReference do
          # csproj já arrasta Braziliation.Game.Core.
          PROJECT="Desenvolvimento/Tests/Braziliation.Game.Tests/Braziliation.Game.Tests.csproj"
          if [[ ! -f "$PROJECT" ]]; then
            echo "::error::$PROJECT não encontrado."
            exit 1
          fi
          dotnet restore "$PROJECT"
          dotnet build  "$PROJECT" --configuration Release --no-restore
          dotnet test   "$PROJECT" --configuration Release --no-build --verbosity normal

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Mesmas checagens do .githooks/pre-commit — o CI pega o que escapou dele
      # (commit com --no-verify ou clone sem o hook ativado).
      - name: Meta-check (pares asset/.meta)
        run: python .claude/skills/meta-check/check_meta_pairs.py

      - name: Paletas da arte própria
        run: |
          python -m pip install --quiet pillow
          python Design/ArteFonte/Ferramentas/check_art_palettes.py
