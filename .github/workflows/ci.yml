name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Detect Unity project layout
        id: unity
        run: |
          if [ -f "Desenvolvimento/ProjectSettings/ProjectVersion.txt" ]; then
            echo "unity=true" >> $GITHUB_OUTPUT
          else
            echo "unity=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore, build and test (.NET)
        shell: bash
        run: |
          set -euo pipefail
          # Alvo único e explícito, SEM fallback: se o projeto sumir de lugar o CI
          # deve falhar alto, não cair silenciosamente num projeto antigo — foi
          # exatamente o fallback anterior que fez o CI rodar testes obsoletos.
          # É o .csproj e não o .slnx porque .slnx só é aceito pelo dotnet CLI a
          # partir do SDK 9.0.2xx e este job roda em 8.0.x; o ProjectReference do
          # csproj já arrasta Braziliation.Game.Core.
          PROJECT="Desenvolvimento/Tests/Braziliation.Game.Tests/Braziliation.Game.Tests.csproj"
          if [[ ! -f "$PROJECT" ]]; then
            echo "::error::$PROJECT não encontrado."
            exit 1
          fi
          dotnet restore "$PROJECT"
          dotnet build  "$PROJECT" --configuration Release --no-restore
          dotnet test   "$PROJECT" --configuration Release --no-build --verbosity normal

      - name: Post-check
        run: |
          if [ "${{ steps.unity.outputs.unity }}" = "true" ]; then
            echo "Unity project detected — gameplay C# builds in the Unity Editor; CI validated repository layout and .NET tests."
          else
            echo "ProjectSettings/ProjectVersion.txt not found — .NET tests ran against the current tree."
          fi
          echo "CI completed."
