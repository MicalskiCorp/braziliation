# CI GitLab — testes .NET (sem Unity no runner)
# Alvo: Desenvolvimento/Tests/Braziliation.Game.Tests/

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

stages:
  - test

dotnet-test:
  image: mcr.microsoft.com/dotnet/sdk:8.0
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - cd "$CI_PROJECT_DIR"
    - |
      set -euo pipefail
      # Alvo único e explícito, SEM fallback — ver comentário equivalente em
      # .github/workflows/ci.yml. O fallback anterior mascarou o CI rodando
      # um conjunto de testes obsoleto.
      export TEST_PROJECT="Desenvolvimento/Tests/Braziliation.Game.Tests/Braziliation.Game.Tests.csproj"
      if [[ ! -f "$TEST_PROJECT" ]]; then
        echo "ERRO: $TEST_PROJECT não encontrado."
        exit 1
      fi
      echo "Using: $TEST_PROJECT"
  script:
    - dotnet restore "$TEST_PROJECT"
    - dotnet build "$TEST_PROJECT" --configuration Release --no-restore
    - dotnet test "$TEST_PROJECT" --configuration Release --no-build --verbosity normal
